[package]
name = "phonebridge"
description = "Mirror and control an Android phone from Windows"
authors = ["PhoneBridge"]
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "phonebridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Stage 1 validation spikes (docs/DEVELOPMENT_PLAN.md): extra commands and a test page.
# Built only by `npm run tauri:spikes` / `npm run spikes:build`, never in a normal build.
spikes = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `serde_bytes` is intentionally absent: video goes over a raw-byte Channel, not serde (REVIEW B1).
phonebridge-adb.workspace = true
phonebridge-scrcpy.workspace = true
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
