version: 2
updates:
  # Tauri's npm packages and crates must move together: `tauri build` fails when the
  # `tauri` crate and `@tauri-apps/api` differ in major.minor, and Dependabot can't bump
  # both ecosystems in one PR. So it only takes Tauri patch releases. Upgrade Tauri
  # minors by hand in one commit: npm i @tauri-apps/api@~2.N @tauri-apps/cli@~2.N,
  # then cargo update -p tauri -p tauri-build.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # typescript-eslint 8.72 accepts TypeScript < 6.1 only, so a TypeScript 7 bump fails `npm ci`.
      # Take TypeScript majors by hand once typescript-eslint supports them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Cargo.lock is committed, so Dependabot also raises lockfile-only minor/patch bumps.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
