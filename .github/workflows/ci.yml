# PhoneBridge CI (Stage 0, DEVELOPMENT_PLAN.md).
# Runs on windows-latest, the only shipping target:
#   frontend - tsc --noEmit, eslint, vitest              (app/)
#   rust     - cargo fmt --check, clippy -D warnings, test (app/src-tauri)
#   bundle   - `tauri build` NSIS smoke test, installer uploaded as artifact
# No phone is needed. Protocol tests replay recorded streams (REVIEW.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (typecheck, lint, test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # No frontend build needed: without the custom-protocol feature, Tauri uses
      # devUrl and never reads ../dist. The bundle job builds and embeds the frontend.
      # --locked makes cargo fail if Cargo.lock is stale instead of silently rewriting it.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  bundle:
    name: Bundle smoke (NSIS)
    runs-on: windows-latest
    needs: [frontend, rust]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          # Release-profile artifacts differ from the debug ones the rust job caches.
          key: release

      - run: npm ci

      # beforeBuildCommand (`npm run build`) builds app/dist first.
      # Arguments after the second `--` are passed to cargo.
      - run: npm run tauri build -- --bundles nsis --ci -- --locked

      - uses: actions/upload-artifact@v7
        with:
          name: phonebridge-nsis-${{ github.sha }}
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
